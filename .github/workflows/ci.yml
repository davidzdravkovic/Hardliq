name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Hardliq.sln

      - name: Build
        run: dotnet build Hardliq.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Hardliq.sln --no-build --configuration Release --verbosity normal
