name: taskmanager-vps

services:
  db-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
    volumes:
      - ./docker-init.sh:/docker-init.sh:ro
    command: ["sh", "/docker-init.sh"]
    networks: [database]

  ai:
    build:
      context: ../../HardliqAi
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-taskmanager}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RAG_INTERNAL_KEY: ${RAG_INTERNAL_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [database]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-taskmanager};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: Hardliq
      Jwt__Audience: Hardliq
      Jwt__ExpiresMinutes: "480"
      Cors__AllowedOrigins: ${PUBLIC_ORIGIN}
      Database__AutoMigrate: "true"
      Rag__BaseUrl: http://ai:8000
      Rag__InternalKey: ${RAG_INTERNAL_KEY}
      Rag__PremiumUsernames__0: ${RAG_PREMIUM_USERNAME:-davidz}
      Rag__UnlimitedUsernames__0: ${RAG_UNLIMITED_USERNAME:-davidz}
      Rag__DailyLimitPerUser: ${RAG_DAILY_LIMIT:-50}
    depends_on:
      db-init:
        condition: service_completed_successfully
      ai:
        condition: service_started
    networks: [edge, database]

networks:
  edge:
    external: true
    name: edge
  database:
    external: true
    name: database
